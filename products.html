<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <style>
      :root {
          --primary-color: #222;
          --secondary-color: #262626;
          --accent-color: #ff3232;
          --text-color: #e6e6e6;
          --text-secondary: #cecece;
          --card-bg: #2e2e2ecc;
          --card-hover: #2e2e2ecc;
      }

      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          scroll-behavior: smooth;
      }

      body {
          background-color: var(--secondary-color);
          color: var(--text-color);
          overflow-x: hidden;
      }

      header {
          position: fixed;
          top: 0;
          width: 100%;
          background-color: rgb(22 22 22 / 80%);
          backdrop-filter: blur(10px);
          z-index: 1000;
          padding: 1rem 3rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
          transition: all 0.3s ease;
      }

      header.scrolled {
          padding: 0.5rem 3rem;
          box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .logo {
          font-size: 1.8rem;
          font-weight: 700;
          color: var(--accent-color);
          text-decoration: none;
          position: relative;
          display: flex;
          align-items: center;
      }

      .logo span {
          color: var(--text-color);
          margin-left: 0.5rem;
      }

      nav ul {
          display: flex;
          list-style: none;
      }

      nav ul li {
          margin-left: 2rem;
      }

      nav ul li a {
          color: var(--text-color);
          text-decoration: none;
          font-size: 1rem;
          font-weight: 500;
          position: relative;
          transition: all 0.3s ease;
      }

      nav ul li a:hover {
          color: var(--accent-color);
      }

      nav ul li a::after {
          content: '';
          position: absolute;
          bottom: -5px;
          left: 0;
          width: 0;
          height: 2px;
          background-color: var(--accent-color);
          transition: width 0.3s ease;
      }

      nav ul li a:hover::after {
          width: 100%;
      }

      #canvas-container {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100vh;
          z-index: -1;
      }

      .hero {
          height: 64vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 0 1rem;
          text-align: center;
          position: relative;
      }

      .hero h1 {
          font-size: 3rem;
          font-weight: 700;
          margin-bottom: 1rem;
          opacity: 0;
          transform: translateY(20px);
          animation: fadeUp 1s ease forwards 0.5s;
      }

      .hero p {
          font-size: 1.2rem;
          font-weight: 400;
          color: var(--text-secondary);
          max-width: 700px;
          margin-bottom: 2rem;
          opacity: 0;
          transform: translateY(20px);
          animation: fadeUp 1s ease forwards 0.7s;
      }

      @keyframes fadeUp {
          to {
              opacity: 1;
              transform: translateY(0);
          }
      }

      .btn {
          padding: 0.8rem 2rem;
          border-radius: 30px;
          font-weight: 600;
          text-decoration: none;
          transition: all 0.3s ease;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
      }

      .btn-primary {
          background-color: var(--accent-color);
          color: var(--secondary-color);
      }

      .btn-primary:hover {
          background-color: transparent;
          color: var(--accent-color);
          box-shadow: 0 0 15px #ff2c2c80;
          transform: translateY(-3px);
      }

      .btn-secondary {
          background-color: transparent;
          color: var(--accent-color);
          border: 2px solid var(--accent-color);
      }

      .btn-secondary:hover {
          background-color: rgb(255 100 100 / 10%);
          box-shadow: 0 0 15px rgb(255 100 100 / 30%);
          transform: translateY(-3px);
      }

      .btn i {
          margin-right: 0.5rem;
      }

      .scroll-down {
          position: absolute;
          bottom: 2rem;
          left: 50%;
          transform: translateX(-50%);
          color: var(--text-secondary);
          font-size: 1.2rem;
          animation: fadeIn 1s ease forwards 1.2s, bounce 2s infinite;
          opacity: 0;
      }

      @keyframes fadeIn {
          to {
              opacity: 1;
          }
      }

      @keyframes bounce {
          0%, 20%, 50%, 80%, 100% {
              transform: translateX(-50%) translateY(0);
          }
          40% {
              transform: translateX(-50%) translateY(-10px);
          }
          60% {
              transform: translateX(-50%) translateY(-5px);
          }
      }

      .featured-section {
          padding: 6rem 3rem;
          background-color: var(--primary-color);
      }

      .section-title {
          font-size: 2.5rem;
          font-weight: 700;
          margin-bottom: 3rem;
          text-align: center;
          position: relative;
          display: inline-block;
      }

      .section-title::after {
          content: '';
          position: absolute;
          bottom: -10px;
          left: 50%;
          transform: translateX(-50%);
          width: 80px;
          height: 4px;
          background-color: var(--accent-color);
      }

      .title-container {
          text-align: center;
          margin-bottom: 3rem;
      }

      .product-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
          gap: 2rem;
          max-width: 1400px;
          margin: 0 auto;
      }

      .product-card {
          background-color: var(--card-bg);
          border-radius: 15px;
          overflow: hidden;
          transition: all 0.3s ease;
          box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
          transform: translateY(20px);
          position: relative;
      }

      .product-card.animate {
          animation: fadeUp 0.8s ease forwards;
      }

      .product-card:hover {
          transform: translateY(-10px);
          box-shadow: 0 15px 30px rgb(0 0 0 / 50%);
          background-color: var(--card-hover);
      }

      .product-img {
          height: 200px;
          overflow: hidden;
      }

      .product-img img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transition: transform 0.5s ease;
      }

      .product-card:hover .product-img img {
          transform: scale(1.1);
      }

      .product-category {
          position: absolute;
          top: 1rem;
          right: 1rem;
          background-color: var(--accent-color);
          color: var(--secondary-color);
          padding: 0.3rem 1rem;
          border-radius: 20px;
          font-size: 0.8rem;
          font-weight: 600;
      }

      .product-content {
          padding: 1.5rem;
      }

      .product-content h3 {
          font-size: 1.5rem;
          margin-bottom: 0.8rem;
          color: var(--text-color);
      }

      .product-content p {
          color: var(--text-secondary);
          margin-bottom: 1.5rem;
          font-size: 0.95rem;
          line-height: 1.6;
      }

      .product-links {
          display: flex;
          gap: 1rem;
      }

      .product-links a {
          color: var(--text-color);
          font-size: 1.2rem;
          transition: all 0.3s ease;
      }

      .product-links a:hover {
          color: var(--accent-color);
          transform: translateY(-3px);
      }

      .view-all {
          text-align: center;
          margin-top: 3rem;
      }

      .search-container {
          position: relative;
          max-width: 600px;
          margin: 0 auto 3rem;
      }

      .search-input {
          width: 100%;
          padding: 1rem 1.5rem;
          border-radius: 30px;
          border: none;
          background-color: var(--card-bg);
          color: var(--text-color);
          font-size: 1rem;
          outline: none;
          transition: all 0.3s ease;
          padding-right: 3rem;
      }

      .search-input:focus {
          box-shadow:0 0 15px rgb(255 26 26 / 52%);
          background-color: var(--card-hover);
      }

      .search-btn {
          position: absolute;
          right: 1rem;
          top: 50%;
          transform: translateY(-50%);
          background: none;
          border: none;
          color: var(--text-secondary);
          font-size: 1.2rem;
          cursor: pointer;
          transition: all 0.3s ease;
      }

      .search-btn:hover {
          color: var(--accent-color);
      }

      .filters {
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 1rem;
          margin-bottom: 2rem;
      }

      .filter-btn {
          padding: 0.5rem 1.5rem;
          border-radius: 20px;
          border: 2px solid var(--card-bg);
          background-color: transparent;
          color: var(--text-color);
          font-size: 0.9rem;
          font-weight: 500;
          cursor: pointer;
          transition: all 0.3s ease;
      }

      .filter-btn:hover, .filter-btn.active {
          background-color: var(--accent-color);
          border-color: var(--accent-color);
          color: var(--secondary-color);
      }

      footer {
          background-color: var(--primary-color);
          padding: 4rem 3rem 2rem;
          text-align: center;
      }

      .footer-content {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
      }

      #contact .footer-content .btn-secondary {
        margin-right: 16px;
      }

      @media (max-width: 768px) {
          header {
            padding: 1rem;
          }

          .logo {
            font-size: 1.6rem;
          }

          .hero h1 {
            font-size: 2.5rem;
          }

          .featured-section {
            padding: 4rem 1.5rem;
          }

          .product-grid {
            grid-template-columns: 1fr;
          }

          .footer-content {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
          }

          #contact .footer-content .btn-secondary {
            margin-bottom: 16px;
          }
      }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <header>
        <a href="index.html" class="logo"><i class="fas fa-code"></i> <span>Portfolio</span></a>
    </header>

    <main>
        <section class="hero">
            <h1>Products</h1>
            <div class="search-container">
              <input type="text" class="search-input" placeholder="Search for products...">
              <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div class="filters">
              <button class="filter-btn active">All</button>
              <button class="filter-btn">3D Model</button>
              <button class="filter-btn">Asset</button>
            </div>
        </section>

        <section class="featured-section">
          <div class="product-grid">
            <div class="product-card">
                <div class="product-img">
                  <img src="img/project3.png" alt="Dragon model">
                </div>
                <span class="product-category">3D Model</span>
                <div class="product-content">
                  <h3>Dragon</h3>
                  <p>This is a 3D model of a dragon.</p>
                  <div class="product-links">
                    <a title="3D Modeling"><i class="fas fa-cube"></i></a>
                    <a href="products/3D_models/index.html" title="Read more"><i class="fas fa-external-link-alt"></i></a>
                  </div>
                </div>
            </div>
            <!-- Майбутні продукти -->
          </div>
        </section>
    </main>

    <footer id="contact">
      <div class="footer-content">
        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=slobozhenyuk.david@gmail.com" class="btn btn-secondary"><i class="fas fa-envelope"></i>Mail</a>
        <a href="https://github.com/9Simba9" class="btn btn-secondary"><i class="fab fa-github"></i>GitHub</a>
      </div>
    </footer>

    <script>
      function searchProducts(query) {
        const productCards = document.querySelectorAll('.product-card');
        productCards.forEach(card => {
          const title = card.querySelector('h3').textContent.toLowerCase();
          if (title.includes(query.toLowerCase())) {
            card.style.display = 'block';
          } else {
            card.style.display = 'none';
          }
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        const searchBtn = document.querySelector('.search-btn');
        const searchInput = document.querySelector('.search-input');
        const filterButtons = document.querySelectorAll('.filter-btn');

        searchBtn.addEventListener('click', () => {
          searchProducts(searchInput.value);
        });

        searchInput.addEventListener('input', () => {
          searchProducts(searchInput.value);
        });

        function filterProducts(category) {
          const productCards = document.querySelectorAll('.product-card');
          productCards.forEach(card => {
            const categorySpan = card.querySelector('.product-category');
            if (category === 'All' || categorySpan.textContent.trim() === category.trim()) {
              card.style.display = 'block';
            } else {
              card.style.display = 'none';
            }
          });
        }

        filterButtons.forEach(button => {
          button.addEventListener('click', () => {
            filterButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            filterProducts(button.textContent.trim());
          });
        });
      });
    </script>
</body>
</html>
